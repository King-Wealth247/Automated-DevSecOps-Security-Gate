name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      use_clean_fixtures:
        description: >-
          Run the gate against the clean test fixtures instead of the live scan
          artifacts (AC-01/AC-04 PASS demonstration). Workflow-dispatch only --
          never available on push/PR, so it can't be mistaken for the real
          gate's verdict on Juice Shop's own code.
        type: boolean
        default: false
      simulate_broken_slack:
        description: >-
          Send the Slack notification to a deliberately invalid webhook URL
          (SRS S12 negative case): the Notify Slack step must fail LOUDLY
          (warning annotation + red step) while the gate decision, the
          policy-gate job, and PASS-gated downstream jobs are unaffected.
          Needs no secret and never touches the real webhook.
        type: boolean
        default: false

jobs:
  build-and-test:
    name: Build & Test (Juice Shop)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: juice-shop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm's Arborist crashes reifying juice-shop/frontend's peer-dependency
      # graph ("Cannot read properties of null (reading 'edgesOut')"),
      # reproduced deterministically in live runs (33816311491, 91861792857)
      # and locally -- traced to #loadPeerSet recursing through the vitest/
      # @vitest/coverage-v8 peer set. Pinning npm to 10.8.2 did NOT fix it
      # (confirmed live, same crash). juice-shop/.npmrc and
      # juice-shop/frontend/.npmrc both set `package-lock=false` deliberately
      # (floating latest deps on every install), so there's no lockfile to
      # regenerate. --legacy-peer-deps uses npm's older, non-crashing peer
      # resolution and fixes it end-to-end.
      #
      # --ignore-scripts: juice-shop/package.json's own "postinstall" script
      # normally chains the ENTIRE frontend install + build + sbom + server
      # build as an automatic side effect of this one step (confirmed live,
      # run at 2026-09-24T14:49: the sbom fix below was completely
      # unreachable because the job already failed inside postinstall,
      # before any later step ever ran). Disabling it here and running each
      # stage explicitly below is what actually makes the sbom compatibility
      # fix reachable, not just correct on paper.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      # --ignore-scripts above is blanket -- it also skips sqlite3's own
      # install script (which fetches/builds its native binding), not just
      # juice-shop's postinstall. Confirmed live (test/api/*.test.ts failing
      # with "Could not locate the bindings file... node_sqlite3.node") and
      # locally. `npm rebuild` (no args) re-triggers the ROOT postinstall
      # too (confirmed locally: identical sbom failure, exit 254) -- naming
      # the package targets only its own install script, not the project's.
      - name: Rebuild native dependencies (sqlite3)
        run: npm rebuild sqlite3

      # --ignore-scripts: not required to fix anything here (this step
      # already worked), applied for the same supply-chain reason it was
      # added to the Dockerfile's frontend install -- verified frontend's
      # only platform-specific package (sass-embedded) has no install
      # script at all, so this closes off ~700 packages' arbitrary
      # lifecycle-script execution at no cost.
      - name: Install frontend dependencies
        working-directory: juice-shop/frontend
        run: npm install --legacy-peer-deps --ignore-scripts

      # frontend/package.json's own "build" script chains
      # `ng build && npm run sbom` atomically, which would let a broken sbom
      # step (see next step) mask a real Angular build failure just as
      # easily as it lets a real one propagate -- call the Angular build on
      # its own so each concern fails independently and visibly.
      - name: Build frontend
        working-directory: juice-shop/frontend
        run: npx ng build --configuration production

      # @angular/build 22.1+ renamed the esbuild metafile it emits from
      # stats.json to browser-stats.json (confirmed locally: installed
      # @angular/build 22.2.0 emits dist/frontend/browser-stats.json, not
      # stats.json), breaking frontend/package.json's "sbom" script, which
      # still hardcodes the old name -- reproduced live (run at
      # 2026-09-24T13:04) and locally with an identical
      # "Error: Missing metafile: dist/frontend/stats.json". juice-shop/'s
      # floating deps (package-lock=false, deliberate upstream choice) mean
      # this kind of drift can recur; fixed via a compatibility alias here
      # rather than editing juice-shop/'s own script, matching how the
      # earlier npm install crash was fixed at the CI-invocation level
      # rather than inside the vendored app.
      - name: Generate frontend SBOM
        working-directory: juice-shop/frontend
        run: |
          cp dist/frontend/browser-stats.json dist/frontend/stats.json
          npm run sbom

      - name: Build server
        run: npm run build:server

      - name: Test
        run: npm test

  # Build ONCE. trivy-scan scans this exact image and publish pushes this exact
  # image (FR-23/24, SEC-06): both load it from the artifact below and verify
  # its image ID against `outputs.image_id`. Previously each of the three jobs
  # rebuilt the Dockerfile independently -- and since juice-shop deliberately
  # floats its dependencies (package-lock=false, node:24 tag), the image Trivy
  # scanned was not guaranteed to be the image that got published.
  docker-build:
    name: Build Docker Image (Juice Shop)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    outputs:
      image_id: ${{ steps.build.outputs.image_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/$OWNER_LC/juice-shop:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build Docker image
        id: build
        run: |
          docker build -f juice-shop/Dockerfile -t "$IMAGE_TAG" juice-shop
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")
          echo "Built $IMAGE_TAG -> $IMAGE_ID"
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Save the image for the scan and publish jobs
        run: |
          set -o pipefail
          docker save "$IMAGE_TAG" | gzip -1 > juice-shop-image.tar.gz
          ls -lh juice-shop-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-image
          path: juice-shop-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  gitleaks-scan:
    name: Gitleaks (Secrets Scan)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --config /repo/security-scans/gitleaks.toml \
            --report-path /repo/gitleaks-report.json --report-format json \
            --exit-code 0 -v

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error

      # Report-only for now: prints the existing evaluator's PASS/BLOCK summary
      # without failing the job. Real enforcement is unified in Phase 3's policy engine.
      - name: Evaluate Gitleaks findings (report only)
        shell: pwsh
        continue-on-error: true
        run: ./security-policy/scripts/evaluate-gitleaks.ps1 -ReportPath gitleaks-report.json

  sonarqube-scan:
    name: SonarQube Cloud (Static Analysis)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Wait for SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Show Quality Gate details
        if: always()
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./security-policy/scripts/evaluate-sonarqube.ps1

  trivy-scan:
    name: Trivy (Container Image Scan)
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/$OWNER_LC/juice-shop:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Download the image docker-build built
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-image

      - name: Load image and verify it is exactly the image docker-build built
        env:
          EXPECTED_IMAGE_ID: ${{ needs.docker-build.outputs.image_id }}
        run: |
          set -o pipefail
          gunzip -c juice-shop-image.tar.gz | docker load
          ACTUAL=$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")
          echo "loaded:   $ACTUAL"
          echo "expected: $EXPECTED_IMAGE_ID"
          if [ "$ACTUAL" != "$EXPECTED_IMAGE_ID" ]; then
            echo "::error::Image ID mismatch -- refusing to scan an image that is not the one docker-build produced"
            exit 1
          fi

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: json
          output: trivy-report.json
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: error

      # Report-only for now: prints the existing evaluator's PASS/BLOCK summary
      # without failing the job. Real enforcement is unified in Phase 3's policy engine.
      - name: Evaluate Trivy findings (report only)
        shell: pwsh
        continue-on-error: true
        run: ./security-policy/scripts/evaluate-trivy.ps1 -ReportPath trivy-report.json

  policy-gate:
    name: Security Policy Gate (Python Engine)
    runs-on: ubuntu-latest
    needs: [gitleaks-scan, trivy-scan, sonarqube-scan]
    if: always()
    timeout-minutes: 10

    # Consumed by the publish job (and any future deploy job) to gate
    # downstream work on the exact PASS/BLOCK verdict (FR-24, SEC-06).
    outputs:
      decision: ${{ steps.decision.outputs.decision }}

    env:
      # promoted from secrets so the "Notify Slack" step's `if:` can read it --
      # the `secrets` context is not available inside `if:` expressions
      # (GitHub Actions only exposes it to `env:`/`with:`), so checking
      # `secrets.SLACK_WEBHOOK_URL` directly there is a hard workflow-parse
      # error, not a runtime skip.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine dependencies
        run: pip install -r security-policy/requirements.txt

      # continue-on-error: if gitleaks-scan/trivy-scan were skipped or failed
      # upstream, the artifact genuinely won't exist and this action errors
      # hard by default -- that must not abort the job before the engine
      # runs, since policy_engine.py's own try/except (FR-30/NFR-03) is what
      # is supposed to turn a missing report into a documented BLOCK, not a
      # bare job crash with no report at all.
      - name: Download Gitleaks report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gitleaks-report
          path: security-policy/reports/incoming

      - name: Download Trivy report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trivy-report
          path: security-policy/reports/incoming

      # unlike gitleaks-scan/trivy-scan's report-only steps
      # above, this job is NOT continue-on-error -- a BLOCK here fails the
      # job and (once Phase 4 adds needs: policy-gate) stops publish/deploy.
      - name: Run Security Policy Engine
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.use_clean_fixtures }}" = "true" ]; then
            # AC-01/AC-04 PASS demonstration: the identical engine and policy.yaml
            # evaluated against the clean fixtures instead of the live scan
            # artifacts (which can never PASS -- task 2.5's documented constraint).
            # Reachable only via the workflow_dispatch input above, never a push/PR.
            python security-policy/policy_engine.py \
              --gitleaks security-policy/tests/fixtures/gitleaks-empty.json \
              --trivy security-policy/tests/fixtures/clean-trivy.json \
              --sonarqube security-policy/tests/fixtures/sonarqube-passed.json \
              --policy security-policy/policy.yaml \
              --report-out security-policy/reports/security-report.md
          else
            python security-policy/policy_engine.py \
              --gitleaks security-policy/reports/incoming/gitleaks-report.json \
              --trivy security-policy/reports/incoming/trivy-report.json \
              --sonar-project-key King-Wealth247_Automated-DevSecOps-Security-Gate \
              --sonar-organization king-wealth247 \
              --policy security-policy/policy.yaml \
              --report-out security-policy/reports/security-report.md
          fi

      - name: Determine gate decision
        if: always()
        id: decision
        run: |
          if grep -q '\*\*Decision:\*\* PASS' security-policy/reports/security-report.md; then
            echo "decision=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "decision=BLOCK" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-policy/reports/security-report.md
          if-no-files-found: error

      # FR-21/22, SRS S12: post on every run regardless of outcome; a broken
      # or unconfigured webhook must never change the gate decision (the
      # "Run Security Policy Engine" step above already set that via its own
      # exit code) -- hence continue-on-error here, and skipped entirely
      # (not a noisy failure) when SLACK_WEBHOOK_URL isn't set.
      #
      # A broken webhook must also be LOGGED, not swallowed: plain `curl -sS`
      # exits 0 on an HTTP 401/404 from Slack, so a dead webhook would have
      # left this step green and nobody the wiser. This step therefore checks
      # the HTTP status itself, annotates the run with a warning, and fails
      # (red step, job still green via continue-on-error).
      # `simulate_broken_slack` (workflow_dispatch only) proves that live
      # without touching the real webhook or needing any secret.
      - name: Notify Slack
        if: ${{ always() && (env.SLACK_WEBHOOK_URL != '' || inputs.simulate_broken_slack == true) }}
        continue-on-error: true
        env:
          DECISION: ${{ steps.decision.outputs.decision }}
          SIMULATE_BROKEN_SLACK: ${{ inputs.simulate_broken_slack }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          URL="$SLACK_WEBHOOK_URL"
          if [ "$SIMULATE_BROKEN_SLACK" = "true" ]; then
            echo "::notice::simulate_broken_slack=true -- posting to a deliberately invalid webhook URL"
            URL="https://hooks.slack.com/services/T00000000/B00000000/INVALIDINVALIDINVALID"
          fi
          PAYLOAD=$(printf '{"text":"DevSecOps Security Gate: %s -- %s @ %s (run: %s)"}' "$DECISION" "$REPO" "$SHA" "$RUN_URL")
          rm -f slack-response.txt
          HTTP_CODE=$(curl -sS --max-time 20 -o slack-response.txt -w '%{http_code}' \
            -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$URL") || HTTP_CODE="curl-error"
          case "$HTTP_CODE" in
            2??)
              echo "Slack notification sent (HTTP $HTTP_CODE)"
              echo "- Slack notification: sent (HTTP $HTTP_CODE)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            curl-error)
              REASON="could not reach the webhook (see the curl error above)"
              ;;
            *)
              BODY=$(head -c 200 slack-response.txt 2>/dev/null | tr -d '\r\n')
              REASON="HTTP $HTTP_CODE from the webhook (${BODY})"
              ;;
          esac
          echo "::warning title=Slack notification failed::${REASON}. The gate decision (${DECISION}) and downstream jobs are unaffected."
          echo "- Slack notification: FAILED -- ${REASON}; gate decision ${DECISION} unaffected" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  publish:
    name: Publish to GHCR (PASS only)
    runs-on: ubuntu-latest
    needs: [policy-gate, docker-build]
    # Root cause of a real, confirmed bug (2026-09-27/28, see
    # IMPLEMENTATION_PLAN.md §20): a job's `if:` gets an INVISIBLE, extra
    # `&& success()` added by GitHub Actions unless the condition itself
    # calls always()/success()/failure()/cancelled() -- and that success()
    # checks the WHOLE ancestor chain, not just this job's own `needs`.
    # `sonarqube-scan` fails repeatedly (the long-standing new_security_rating
    # Quality Gate issue), and even though `policy-gate` shields ITSELF from
    # that with its own `if: always()` and correctly outputs decision=PASS,
    # the invisible check further downstream still saw the transitive
    # sonarqube-scan failure and silently skipped this job regardless of the
    # real decision -- proven with two isolated canary jobs (bare and
    # ${{ }}-wrapped forms of the old condition both skipped identically;
    # only the always()-shielded diagnostic job ran).
    #
    # Fix: `!cancelled()` is GitHub's own idiom for "tolerate upstream
    # FAILURES, but still respect an actual cancellation of the run" --
    # chosen over `always()` specifically because `always()` would also let
    # this job run through a genuine workflow cancellation, which is not
    # acceptable for a step that pushes to a registry. The explicit
    # `needs.*.result == 'success'` checks restore the normal "my direct
    # dependencies must have succeeded" requirement that `!cancelled()`
    # otherwise bypasses, so a real `docker-build` failure (or the run being
    # cancelled) still cleanly skips this job instead of letting it through
    # to fail later on a missing artifact. The actual security gate --
    # `decision == 'PASS'` -- is unchanged: a BLOCK, a missing/malformed
    # report, or a cancelled run all still correctly skip publish.
    if: ${{ !cancelled() && needs.policy-gate.result == 'success' && needs.docker-build.result == 'success' && needs.policy-gate.outputs.decision == 'PASS' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Compute image tag
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/$OWNER_LC/juice-shop:${{ github.sha }}" >> "$GITHUB_ENV"

      # Push the image docker-build built and trivy-scan scanned -- NOT a fresh
      # rebuild (FR-23/24, SEC-06): the identity check below refuses to publish
      # anything else.
      - name: Download the image docker-build built
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-image

      - name: Load image and verify it is exactly the image that was scanned
        env:
          EXPECTED_IMAGE_ID: ${{ needs.docker-build.outputs.image_id }}
        run: |
          set -o pipefail
          gunzip -c juice-shop-image.tar.gz | docker load
          ACTUAL=$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")
          echo "loaded:   $ACTUAL"
          echo "expected: $EXPECTED_IMAGE_ID"
          if [ "$ACTUAL" != "$EXPECTED_IMAGE_ID" ]; then
            echo "::error::Image ID mismatch -- refusing to publish an image that is not the one that was scanned"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        env:
          IMAGE_ID: ${{ needs.docker-build.outputs.image_id }}
        run: |
          docker push "$IMAGE_TAG"
          DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_TAG" 2>/dev/null || echo "n/a")
          echo "- Published \`$IMAGE_TAG\` -- image id \`$IMAGE_ID\` (identical to the scanned image), registry digest \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-flyio-temp:
    name: Deploy to Fly.io (TEMPORARY - AWS OIDC blocked, task 4.3)
    runs-on: ubuntu-latest
    needs: [policy-gate, publish]
    # Same PASS-only gate as `publish` (FR-25 analog), and the identical
    # transitive-success bug fix applied there (see that job's comment and
    # IMPLEMENTATION_PLAN.md §20) -- `needs.publish.result == 'success'`
    # takes over the "skipped automatically whenever publish is" role that a
    # bare `if:` used to get for free, since `!cancelled()` bypasses that
    # default too and it must be restored explicitly.
    if: ${{ !cancelled() && needs.policy-gate.result == 'success' && needs.publish.result == 'success' && needs.policy-gate.outputs.decision == 'PASS' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/$OWNER_LC/juice-shop:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4

      # Deploys the exact image `publish` already built, Trivy-scanned, and
      # pushed to GHCR -- no separate Fly-side rebuild (see fly.toml's own
      # comment header for why this matters for image provenance). Requires
      # the GHCR package to be pullable by Fly (public, or a registry
      # credential configured -- see infra/flyio/README.md).
      - name: Deploy already-scanned image to Fly.io
        run: flyctl deploy --config juice-shop/fly.toml --image "$IMAGE_TAG" --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  policy-gate-pass-rehearsal:
    name: Security Policy Gate - PASS Rehearsal
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine dependencies
        run: pip install -r security-policy/requirements.txt

      # AC-01/AC-04 require demonstrating a live PASS decision. Juice Shop's
      # own code organically contains ~70 secrets and 8 CRITICAL/38 HIGH
      # vulnerabilities (task 2.5's documented constraint), so a live scan
      # of juice-shop/ itself can never PASS under policy.yaml's thresholds
      # -- and those thresholds must not be relaxed, nor juice-shop/ touched,
      # just to force one. This job runs the exact same engine and the exact
      # same policy.yaml against a controlled clean input -- the same
      # fixtures already proven by test_clean_inputs_pass_and_exit_zero --
      # to demonstrate the PASS path for real inside GitHub Actions, not
      # just in pytest. Manually triggered only (workflow_dispatch), never
      # on push/PR, so it can't be mistaken for the real gate's verdict.
      - name: Run Security Policy Engine against a clean input
        run: |
          python security-policy/policy_engine.py \
            --gitleaks security-policy/tests/fixtures/gitleaks-empty.json \
            --trivy security-policy/tests/fixtures/clean-trivy.json \
            --sonarqube security-policy/tests/fixtures/sonarqube-passed.json \
            --policy security-policy/policy.yaml \
            --report-out security-policy/reports/pass-rehearsal-report.md

      - name: Upload PASS rehearsal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass-rehearsal-report
          path: security-policy/reports/pass-rehearsal-report.md
          if-no-files-found: error

  policy-gate-negative-rehearsal:
    name: Security Policy Gate - Fail-Closed & Determinism Rehearsal (AC-05/AC-06)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine dependencies
        run: pip install -r security-policy/requirements.txt

      # AC-05 / FR-30 / NFR-03: a missing, malformed or unreachable input must
      # BLOCK ("fail closed"), never pass. AC-06 / FR-15: identical inputs give
      # an identical decision on 3 consecutive runs. The script asserts both
      # through the real CLI -- this job goes red if ANY guarantee is violated.
      # Needs no secrets and no network (the "unreachable SonarQube" case aims
      # at a closed localhost port). Manually triggered only, like the PASS
      # rehearsal, so it never runs on push/PR.
      - name: Rehearse fail-closed and deterministic behavior
        run: bash security-policy/scripts/rehearse-negative-cases.sh security-policy/reports/negative-rehearsal

      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negative-rehearsal-evidence
          path: security-policy/reports/negative-rehearsal
          if-no-files-found: error
