name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (Juice Shop)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: juice-shop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker-build:
    name: Build Docker Image (Juice Shop)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/$OWNER_LC/juice-shop:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -f juice-shop/Dockerfile -t "$IMAGE_TAG" juice-shop
