# TEMPORARY interim deployment target (see infra/flyio/README.md and
# IMPLEMENTATION_PLAN.md's "Temporary Deployment Strategy" section).
#
# AWS EC2, reached via the OIDC-federated role in infra/aws/, remains this
# project's real and final deployment target (FR-25/FR-26). This file exists
# only because task 4.3's AWS OIDC federation is currently blocked on an
# AWS-side new-account hold (see IMPLEMENTATION_PLAN.md S20) -- it is a
# stand-in so the PASS -> deploy half of the pipeline can still be
# demonstrated while that clears, not a replacement for the AWS path.
#
# Deliberately has NO [build] section: `flyctl deploy --image ...` (see the
# `deploy-flyio-temp` job in .github/workflows/ci.yml) deploys the exact
# image `publish` already built, Trivy-scanned, and pushed to GHCR -- Fly
# never rebuilds this Dockerfile itself. This preserves the same
# "deploy exactly what was scanned" chain of custody the AWS path provides,
# which a source-rebuilding platform (e.g. Vercel) could not (see
# IMPLEMENTATION_PLAN.md's Vercel evaluation in the same section).
#
# App name must be globally unique on Fly.io -- if `devsecops-juice-shop-temp`
# is already taken, change it here AND when you `fly apps create` (see
# infra/flyio/README.md Step 2).
app = "devsecops-juice-shop-temp"
primary_region = "iad"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
